name: Deploy Firebase Functions

on:
  push:
    branches: [main]
    paths:
      - 'firebase/functions/**'
  workflow_dispatch:

env:
  FIREBASE_PROJECT_ID: aquacare-system

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: firebase/functions/package-lock.json
      
      - name: Install dependencies
        working-directory: firebase/functions
        run: npm ci
      
      - name: Build functions
        working-directory: firebase/functions
        run: npm run build
      
      - name: Deploy to Firebase
        working-directory: firebase/functions
        run: npx firebase-tools deploy --only functions --project $FIREBASE_PROJECT_ID
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
      
      - name: Post deployment check
        run: echo "Functions deployed successfully!"
