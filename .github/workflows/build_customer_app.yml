name: Build Customer App

on:
  push:
    branches: [main]
    paths:
      - 'apps/customer_app/**'
      - 'packages/shared/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.0'
          channel: 'stable'
      
      - name: Get dependencies
        working-directory: apps/customer_app
        run: |
          flutter pub get
          cd ../../packages/shared
          flutter pub get
      
      - name: Analyze code
        working-directory: apps/customer_app
        run: flutter analyze
      
      - name: Format check
        working-directory: apps/customer_app
        run: dart format --set-exit-if-changed lib/
      
      - name: Run tests
        working-directory: apps/customer_app
        run: flutter test
      
      - name: Build APK
        working-directory: apps/customer_app
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: customer-app-apk
          path: apps/customer_app/build/app/outputs/flutter-apk/app-release.apk
