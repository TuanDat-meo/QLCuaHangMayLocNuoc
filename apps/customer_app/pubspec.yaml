name: customer_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.4.0
  flutter_dotenv: ^5.1.0

  # State Management
  provider: ^6.1.0
  riverpod: ^2.5.0

  # Shared package
  shared:
    path: ../../packages/shared

  # UI & Utils
  cupertino_icons: ^1.0.8
  get_it: ^7.6.0
  logger: ^2.1.0
  equatable: ^2.0.5
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
