name: technician_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.15.0
  cloud_firestore: ^5.6.0
  firebase_auth: ^5.7.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.4.0
  flutter_dotenv: ^5.1.0

  # State Management
  provider: ^6.1.0
  riverpod: ^2.5.0

  # Shared package
  shared:
    path: ../../packages/shared

  # UI & Utils
  cupertino_icons: ^1.0.8
  get_it: ^7.6.0
  logger: ^2.1.0
  equatable: ^2.0.5
  intl: ^0.20.0

  # Maps & Navigation
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  geolocator: ^13.0.4

  # Media
  image_picker: ^1.1.2

  # Networking
  http: ^1.1.0
  connectivity_plus: ^6.0.3

  # Calendar
  table_calendar: ^3.1.2

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Charts
  fl_chart: ^0.70.2
  pdf: ^3.12.0
  share_plus: ^13.1.0
  path_provider: ^2.1.5
  timezone: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/fonts/Roboto-Regular.ttf
    - assets/fonts/Roboto-Bold.ttf
