name: aquacare_system
description: AquaCareSystem - Water purifier system management

repository: https://github.com/aquacare/system

# Monorepo packages
packages:
  - apps/**
  - packages/**

# Melos scripts
scripts:
  bootstrap:
    run: melos exec -- flutter pub get
    description: Bootstrap all packages

  analyze:
    run: melos exec -- flutter analyze
    description: Analyze all packages

  format:
    run: melos exec -- dart format lib/
    description: Format all Dart code

  test:
    run: melos exec -- flutter test
    description: Run tests in all packages

  build:customer:
    run: |
      cd apps/customer_app && \
      flutter build apk --release
    description: Build customer app release APK

  build:customer:ios:
    run: |
      cd apps/customer_app && \
      flutter build ios --release
    description: Build customer app release IPA
    packageFilesExist:
      - apps/customer_app/pubspec.yaml

  build:technician:
    run: |
      cd apps/technician_app && \
      flutter build apk --release
    description: Build technician app release APK

  build:technician:ios:
    run: |
      cd apps/technician_app && \
      flutter build ios --release
    description: Build technician app release IPA
    packageFilesExist:
      - apps/technician_app/pubspec.yaml

  clean:
    run: melos exec -- flutter clean
    description: Clean build artifacts

version:
  path: pubspec.yaml
  workspaceChangelog: true
